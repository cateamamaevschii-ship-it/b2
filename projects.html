<head>

  <link rel="stylesheet" href="./css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════
       CODEKA-INSPIRED PROJECTS PAGE — B2 DARK THEME
       ═══════════════════════════════════════════════════════ */

    body {
      padding-top: 0 !important;
      overflow: hidden;
      height: 100vh;
    }

    /* Hide default header on this page — we use our own minimal nav */
    header.always-visible {
      background: transparent !important;
      border-bottom: none !important;
      backdrop-filter: none !important;
    }

    /* ── Main Layout ── */
    .projects-section {
      display: flex;
      height: calc(100vh - 14px);
      margin: 7px;
      position: relative;
      background-color: var(--bg-color);
    }

    /* ── LEFT SIDEBAR — Categories ── */
    .projects-sidebar-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 280px;
      flex-shrink: 0;
      padding: 0 2.5rem;
      position: sticky;
      top: 0;
      height: 100%;
    }

    .sidebar-left-bottom {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(240, 240, 240, 0.25);
      font-weight: 300;
      position: absolute;
      bottom: 2.5rem;
      left: 2.5rem;
      white-space: nowrap;
    }

    /* ── Category Filter Pills ── */
    .sidebar-filters {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sidebar-filter-btn {
      background: none;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240, 240, 240, 0.25);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      padding: 0.6rem 0;
    }

    .sidebar-filter-btn:hover,
    .sidebar-filter-btn.active {
      color: var(--accent-color);
    }

    .sidebar-filter-btn.active::before {
      content: '— ';
      color: var(--accent-color);
    }

    /* ── CENTER — Scrollable Images ── */
    .projects-center {
      flex: 1;
      overflow-y: auto;
      height: 100%;
      scroll-behavior: auto;
      /* We manage smoothness ourselves */
    }

    /* Hide scrollbar */
    .projects-center::-webkit-scrollbar {
      display: none;
    }

    .projects-center {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .project-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 55vh;
      cursor: pointer;
      padding: 1.5vh 0;
    }

    .project-slot-inner {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      height: 100%;
      aspect-ratio: 3 / 2;
      max-width: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
        opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      background-color: #0a0a0a;
    }

    .project-slot-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .project-slot:hover .project-slot-inner img {
      transform: scale(1.03);
    }

    /* Hover overlay */
    .project-slot-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      transition: background 0.4s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2.5rem;
      pointer-events: none;
    }

    .project-slot:hover .project-slot-overlay {
      background: rgba(0, 0, 0, 0.15);
    }

    .project-slot-overlay span {
      color: #fff;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.35s ease;
    }

    .project-slot:hover .project-slot-overlay span {
      opacity: 1;
      transform: translateY(0);
    }

    /* Bottom gradient info strip */
    .project-slot-meta {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 2rem;
      background: linear-gradient(to top, rgba(5, 5, 5, 0.7) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    .project-slot-meta .tags {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .project-slot-meta .year {
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.3);
      font-variant-numeric: tabular-nums;
    }

    /* ── Active Project Number (bottom-right of center area) ── */
    .active-project-number {
      position: absolute;
      bottom: 2.5rem;
      right: 2.5rem;
      font-family: 'Outfit', sans-serif;
      font-size: 2.6rem;
      font-weight: 600;
      color: rgba(240, 240, 240, 0.12);
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      z-index: 30;
    }


    /* ═══════════════════════════════════════════════════════
       DETAIL VIEW OVERLAY
       ═══════════════════════════════════════════════════════ */
    .detail-overlay {
      position: fixed;
      z-index: 9000;
      top: 7px;
      left: 7px;
      right: 7px;
      bottom: 7px;
      background-color: var(--bg-color);
      display: flex;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.5s cubic-bezier(0.76, 0, 0.24, 1),
        transform 0.5s cubic-bezier(0.76, 0, 0.24, 1);
      pointer-events: none;
    }

    .detail-overlay.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    /* Detail Left Panel */
    .detail-left {
      width: 36%;
      padding: 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-info {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.65s 0.15s cubic-bezier(0.76, 0, 0.24, 1),
        transform 0.65s 0.15s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .detail-overlay.open .detail-info {
      opacity: 1;
      transform: translateY(0);
    }

    .detail-counter {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(240, 240, 240, 0.2);
      margin-bottom: 1.5rem;
    }

    .detail-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      letter-spacing: -0.03em;
      color: var(--text-primary);
      line-height: 1.05;
      text-transform: uppercase;
      margin-bottom: 0;
    }

    .detail-category {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 1.5rem;
      line-height: 1.6;
    }

    .detail-tags {
      font-size: 0.65rem;
      color: rgba(240, 240, 240, 0.2);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.75rem;
    }

    .detail-year {
      font-size: 0.8rem;
      color: rgba(240, 240, 240, 0.15);
      margin-top: 1rem;
    }

    .detail-back-btn {
      background: none;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240, 240, 240, 0.25);
      cursor: pointer;
      transition: color 0.3s ease;
      text-align: left;
      padding: 0;
    }

    .detail-back-btn:hover {
      color: var(--accent-color);
    }

    /* Detail Right Panel — Scrollable Images */
    .detail-right {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .detail-right::-webkit-scrollbar {
      display: none;
    }

    .detail-right {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .detail-image-slot {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 85vh;
      padding: 1.5vh 0;
    }

    .detail-image-inner {
      position: relative;
      overflow: hidden;
      border-radius: 3px;
      height: 100%;
      aspect-ratio: 3 / 2;
      max-width: 100%;
      background-color: #0a0a0a;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
        opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .detail-image-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-image-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.25rem;
    }

    .detail-image-label .label-text {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(240, 240, 240, 0.3);
    }

    .detail-image-label .label-num {
      font-size: 0.6rem;
      font-variant-numeric: tabular-nums;
      color: rgba(240, 240, 240, 0.2);
    }


    /* ═══════════════════════════════════════════════════════
       RESPONSIVE
       ═══════════════════════════════════════════════════════ */
    @media (max-width: 1024px) {
      .projects-sidebar-left {
        display: none;
      }

      .active-project-number {
        display: none;
      }

      .projects-section {
        margin: 0;
        height: 100vh;
      }

      .projects-center {
        width: 100%;
      }

      /* Mobile: sticky top bar with filters */
      .mobile-top-bar {
        display: flex;
        flex-direction: column;
        padding: 100px 5% 1rem;
        gap: 0.75rem;
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(5, 5, 5, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        transition: padding 0.3s ease;
      }

      .mobile-top-bar.scrolled {
        padding-top: 1rem;
      }

      .mobile-page-title {
        font-size: 2rem;
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        transition: font-size 0.3s ease, opacity 0.3s ease;
      }

      .mobile-top-bar.scrolled .mobile-page-title {
        font-size: 0;
        opacity: 0;
        margin: 0;
        overflow: hidden;
        height: 0;
      }

      .mobile-filters {
        display: flex;
        gap: 0.6rem;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding-bottom: 0.25rem;
      }

      .mobile-filters::-webkit-scrollbar {
        display: none;
      }

      .mobile-filter-btn {
        background: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-family: 'Outfit', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: rgba(240, 240, 240, 0.4);
        cursor: pointer;
        padding: 0.5rem 1.1rem;
        border-radius: 100px;
        transition: all 0.3s ease;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .mobile-filter-btn:active {
        transform: scale(0.95);
      }

      .mobile-filter-btn.active {
        color: var(--bg-color);
        background: var(--accent-color);
        border-color: var(--accent-color);
      }

      .project-slot {
        height: 45vh;
      }

      .project-slot-inner {
        aspect-ratio: 16 / 10;
        width: 90%;
        margin: 0 auto;
      }

      /* Detail view mobile */
      .detail-overlay {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        flex-direction: column;
      }

      .detail-left {
        display: none;
      }

      .detail-right {
        width: 100%;
      }

      .detail-mobile-hero {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 1.5rem 5% 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .detail-mobile-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .detail-mobile-close {
        background: none;
        border: 1px solid var(--text-primary);
        color: var(--text-primary);
        font-family: 'Outfit', sans-serif;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .detail-mobile-close:hover {
        background: var(--text-primary);
        color: var(--bg-color);
      }

      .detail-mobile-info {
        margin-top: 1.5rem;
      }

      .detail-image-slot {
        height: 75vh;
      }
    }

    @media (min-width: 1025px) {
      .mobile-top-bar {
        display: none;
      }

      .detail-mobile-hero {
        display: none;
      }
    }
  </style>
</head>

      {

        titleKey: 'proj_new_12_title',
        category: 'consulting',

        year: '2024',
        images: [
          { src: 'https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=80', label: 'Masterplan Board' },
          { src: 'https://images.unsplash.com/photo-1531973576160-7125cd663d86?auto=format&fit=crop&w=1200&q=80', label: 'Presentation' },
          { src: 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80', label: 'Model View' },
          { src: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1200&q=80', label: 'Office' },
        ]

    const N = projects.length;
    const categories = [
      { key: 'design', labelKey: 'filter_design', label: 'Design' },
      { key: 'architecture', labelKey: 'filter_architecture', label: 'Architecture' },
      { key: 'consulting', labelKey: 'filter_consulting', label: 'Consulting' },
      { key: 'outdoors', labelKey: 'filter_outdoors', label: 'Outdoors' },
    ];

    let activeFilter = 'architecture';
    let filteredProjects = projects.filter(p => p.category === 'architecture');
    let activeIdx = 0;

    const centerEl = document.getElementById('projects-center');
    const sidebarFilters = document.getElementById('sidebar-filters');
    const mobileFilters = document.getElementById('mobile-filters');
    const projectNumberEl = document.getElementById('active-project-number');
    const detailOverlay = document.getElementById('detail-overlay');
    const detailRight = document.getElementById('detail-right');

    /* ─── Helpers ─── */
    function getTranslation(key) {
      const lang = localStorage.getItem('site_lang') || 'en';
      return (translations[lang] && translations[lang][key]) || key;
    }

    /* ─── Build Filter Buttons ─── */
    function buildFilters() {
      // Desktop sidebar filters
      sidebarFilters.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'sidebar-filter-btn' + (cat.key === activeFilter ? ' active' : '');
        btn.textContent = getTranslation(cat.labelKey);
        btn.setAttribute('data-i18n', cat.labelKey);
        btn.addEventListener('click', () => applyFilter(cat.key));
        sidebarFilters.appendChild(btn);
      });

      // Mobile filters
      mobileFilters.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'mobile-filter-btn' + (cat.key === activeFilter ? ' active' : '');
        btn.textContent = getTranslation(cat.labelKey);
        btn.setAttribute('data-i18n', cat.labelKey);
        btn.addEventListener('click', () => applyFilter(cat.key));
        mobileFilters.appendChild(btn);
      });
    }

    function applyFilter(key) {
      activeFilter = key;
      filteredProjects = projects.filter(p => p.category === key);
      activeIdx = 0;
      buildFilters();
      renderCenter();
    }

    /* ─── Render Center Scrollable Area ─── */
    function renderCenter() {
      // Remove old project slots (keep mobile-top-bar)
      const existingSlots = centerEl.querySelectorAll('.project-slot');
      existingSlots.forEach(s => s.remove());

      // Triple the list for infinite scroll
      const tripled = [...filteredProjects, ...filteredProjects, ...filteredProjects];

      tripled.forEach((p, i) => {
        const slot = document.createElement('div');
        slot.className = 'project-slot';
        slot.dataset.category = p.category;
        slot.addEventListener('click', () => openDetail(p));

        slot.innerHTML = `
          <div class="project-slot-inner">
            <img src="${p.images[0].src}" alt="${getTranslation(p.titleKey)}" loading="lazy">
            <div class="project-slot-overlay">
              <span data-i18n="view_project">View Project →</span>
            </div>
            <div class="project-slot-meta">
              <span class="tags">${p.tags}</span>
              <span class="year">${p.year}</span>
            </div>
          </div>
        `;
        centerEl.appendChild(slot);
      });

      // Set initial scroll to middle copy
      requestAnimationFrame(() => {
        const containerH = centerEl.clientHeight || window.innerHeight;
        const slotH = containerH * 0.55;
        const sectionH = filteredProjects.length * slotH;
        const offset = (slotH - containerH) / 2;
        centerEl.scrollTop = sectionH + offset;
      });
    }

    /* ─── Mobile Top Bar Scroll Condensing ─── */
    const mobileTopBar = document.querySelector('.mobile-top-bar');
    centerEl.addEventListener('scroll', () => {
      if (mobileTopBar && window.innerWidth <= 1024) {
        if (centerEl.scrollTop > 80) {
          mobileTopBar.classList.add('scrolled');
        } else {
          mobileTopBar.classList.remove('scrolled');
        }
      }
    }, { passive: true });

    /* ─── Infinite Scroll + Active Tracking ─── */
    centerEl.addEventListener('scroll', () => {
      const fN = filteredProjects.length;
      if (fN === 0) return;

      const containerH = centerEl.clientHeight || window.innerHeight;
      const slotH = containerH * 0.55;
      const sectionH = fN * slotH;
      const offset = (slotH - containerH) / 2;
      const st = centerEl.scrollTop;

      // Infinite loop
      if (st >= sectionH * 2 + offset) {
        centerEl.scrollTop = st - sectionH;
      } else if (st < sectionH + offset) {
        centerEl.scrollTop = st + sectionH;
      }

      // Active index
      const currentSt = centerEl.scrollTop;
      const rawIdx = Math.round((currentSt + containerH / 2 - slotH / 2) / slotH);
      const positiveIdx = ((rawIdx % fN) + fN) % fN;

      if (positiveIdx !== activeIdx) {
        activeIdx = positiveIdx;
        projectNumberEl.textContent = filteredProjects[activeIdx]?.id || '01';
      }

      // Scale-on-scroll for visible slots
      applyScaleEffect();
    }, { passive: true });

    /* ─── Scale-on-Scroll Effect ─── */
    function applyScaleEffect() {
      const slots = centerEl.querySelectorAll('.project-slot-inner');
      const containerH = centerEl.clientHeight;
      const containerRect = centerEl.getBoundingClientRect();
      const centerY = containerRect.top + containerH / 2;

      slots.forEach(slot => {
        const rect = slot.getBoundingClientRect();
        const slotCenterY = rect.top + rect.height / 2;
        const distance = Math.abs(centerY - slotCenterY);
        const maxDist = containerH * 0.6;
        const progress = Math.max(0, 1 - distance / maxDist);

        // Scale: 0.76 → 1
        const scale = 0.76 + progress * 0.24;
        // Opacity: 0.5 → 1 (raised min from 0.25)
        const opacity = 0.5 + progress * 0.5;

        slot.style.transform = `scale(${scale})`;
        slot.style.opacity = opacity;
      });
    }

    /* ─── Detail View ─── */
    function openDetail(project, shouldPushState = true) {
      const fN = filteredProjects.length;

      // Fill left panel info
      document.getElementById('detail-counter').textContent = `${project.id} / ${String(N).padStart(2, '0')}`;
      document.getElementById('detail-title').textContent = getTranslation(project.titleKey);
      document.getElementById('detail-category').textContent = getTranslation(project.catKey);
      document.getElementById('detail-tags').textContent = project.tags;
      document.getElementById('detail-year').textContent = project.year;

      // Fill right panel images — triple for infinite scroll
      const isMobile = window.innerWidth < 1025;
      const imagesToRender = isMobile ? project.images : [...project.images, ...project.images, ...project.images];
      const M = project.images.length;

      detailRight.innerHTML = '';

      // Mobile hero
      if (isMobile) {
        const hero = document.createElement('div');
        hero.className = 'detail-mobile-hero';
        hero.innerHTML = `
          <div class="detail-mobile-top">
            <a href="index.html" class="logo">B²<span>STUDIO</span></a>
            <button class="detail-mobile-close" onclick="closeDetail()">✕ Close</button>
          </div>
          <div class="detail-mobile-info">
            <p class="detail-counter">${project.id} / ${String(N).padStart(2, '0')}</p>
            <h1 class="detail-title" style="font-size:clamp(2rem,8vw,3.5rem); margin-top:0.75rem;">${getTranslation(project.titleKey)}</h1>
            <p class="detail-category" style="margin-top:1rem;">${getTranslation(project.catKey)}</p>
            <p class="detail-tags" style="margin-top:0.5rem;">${project.tags}</p>
            <p class="detail-year" style="margin-top:0.5rem;">${project.year}</p>
          </div>
        `;
        detailRight.appendChild(hero);
      }

      const imagesContainer = document.createElement('div');
      imagesContainer.style.padding = '0 1.5rem';

      imagesToRender.forEach((img, i) => {
        const wrapper = document.createElement('div');

        const slot = document.createElement('div');
        slot.className = 'detail-image-slot';

        const inner = document.createElement('div');
        inner.className = 'detail-image-inner';
        inner.innerHTML = `<img src="${img.src}" alt="${getTranslation(project.titleKey)} - ${img.label}" loading="lazy">`;

        slot.appendChild(inner);
        wrapper.appendChild(slot);

        const labelDiv = document.createElement('div');
        labelDiv.className = 'detail-image-label';
        labelDiv.innerHTML = `
          <span class="label-text">${img.label}</span>
          <span class="label-num">${String((i % M) + 1).padStart(2, '0')}</span>
        `;
        wrapper.appendChild(labelDiv);

        imagesContainer.appendChild(wrapper);
      });

      detailRight.appendChild(imagesContainer);

      if (shouldPushState) {
        history.pushState({ projectOpen: true }, '', `#project-${project.id}`);
      }

      // Open overlay
      detailOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Desktop: initialize infinite scroll for detail images
      if (!isMobile) {
        requestAnimationFrame(() => {
          const copyH = detailRight.scrollHeight / 3;
          detailRight.scrollTop = copyH;
        });

        detailRight.onscroll = function () {
          const st = detailRight.scrollTop;
          const copyH = detailRight.scrollHeight / 3;
          if (st >= copyH * 2) {
            detailRight.scrollTop = st - copyH;
          } else if (st < copyH) {
            detailRight.scrollTop = st + copyH;
          }
          // Scale effect on detail images
          applyDetailScaleEffect();
        };
      }

      // Apply initial scale effect
      setTimeout(() => {
        applyDetailScaleEffect();
      }, 100);
    }

    function closeDetail(shouldGoBack = true) {
      detailOverlay.classList.remove('open');
      document.body.style.overflow = 'hidden'; // Keep body hidden since we're in the projects layout
      detailRight.onscroll = null;

      if (shouldGoBack && history.state && history.state.projectOpen) {
        history.back();
      }
    }

    document.getElementById('detail-back-btn').addEventListener('click', () => closeDetail());

    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && detailOverlay.classList.contains('open')) {
        closeDetail();
      }
    });

    function checkHashAndOpen() {
      const hash = window.location.hash;
      const match = hash.match(/^#project-(\d+)/);
      if (match) {
        const projId = match[1];
        const project = projects.find(p => p.id === projId);
        if (project) {
          openDetail(project, false);
        }
      }
    }

    window.addEventListener('popstate', () => {
      const hash = window.location.hash;
      const match = hash.match(/^#project-(\d+)/);
      if (match) {
        const projId = match[1];
        const project = projects.find(p => p.id === projId);
        if (project) {
          openDetail(project, false);
        }
      } else {
        if (detailOverlay.classList.contains('open')) {
          closeDetail(false);
        }
      }
    });

    /* ─── Scale Effect for Detail View ─── */
    function applyDetailScaleEffect() {
      const inners = detailRight.querySelectorAll('.detail-image-inner');
      const containerH = detailRight.clientHeight;
      const containerRect = detailRight.getBoundingClientRect();
      const centerY = containerRect.top + containerH / 2;

      inners.forEach(inner => {
        const rect = inner.getBoundingClientRect();
        const slotCenterY = rect.top + rect.height / 2;
        const distance = Math.abs(centerY - slotCenterY);
        const maxDist = containerH * 0.6;
        const progress = Math.max(0, 1 - distance / maxDist);

        // Scale: 0.92 → 1 (subtle, not aggressive)
        const scale = 0.92 + progress * 0.08;
        // Opacity: 0.85 → 1 (images stay clearly visible)
        const opacity = 0.85 + progress * 0.15;

        inner.style.transform = `scale(${scale})`;
        inner.style.opacity = opacity;
      });
    }

    /* ─── Language switcher re-translation ─── */
    document.querySelectorAll('.language-switcher button').forEach(btn => {
      btn.addEventListener('click', () => {
        setTimeout(() => {
          buildFilters();
          // Re-render center to update alt texts
          renderCenter();
        }, 50);
      });
    });

    /* ─── Initialize ─── */
    buildFilters();
    renderCenter();
    checkHashAndOpen();

    // Initial scale effect
    setTimeout(() => applyScaleEffect(), 300);
  </script>
